# Production overlay for Horilla HR (open-source).
#
# Usage:
#   cp .env.dist .env   # then set strong secrets
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#   # or: make prod
#
# Requires Docker Compose v2.24+ (!override / !reset merge).
# Does not bind-mount source code; uses image contents + named volumes.
#
# Uses the PostgreSQL and Redis already running on this host (reached at
# 172.17.0.1, the Docker bridge gateway) instead of the bundled db/redis.

services:
  web:
    env_file:
      - .env
    environment: !override
      DEBUG: "0"
      HORILLA_ENV: production
      DB_HOST: ${DB_HOST:-172.17.0.1}
      DB_PORT: ${DB_PORT:-5432}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DB_INIT_PASSWORD: ${DB_INIT_PASSWORD:?Set DB_INIT_PASSWORD in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-}
      GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}
    volumes: !override
      - staticfiles:/app/staticfiles
      - media:/app/media
    # No nginx in front: gunicorn is published directly on host port 1000,
    # which is where the Cloudflare Tunnel points. Static files are served by
    # WhiteNoise; /media/ goes through Django's protected_media() as before.
    ports: !override
      - "${HTTP_PORT:-1000}:8000"
    # db and redis are external (see below), so there is nothing to wait for.
    depends_on: !reset {}
    # Come back after a crash or a host reboot. The base file only sets this
    # on scheduler, so without it a reboot left the site down.
    restart: unless-stopped

  # Single replica: see the comment on this service in docker-compose.yml.
  # Mirrors web's environment so both read the same .env, minus the HTTP-only
  # settings and with release tasks left to the web container.
  scheduler:
    env_file:
      - .env
    environment: !override
      DEBUG: "0"
      HORILLA_ENV: production
      DB_HOST: ${DB_HOST:-172.17.0.1}
      DB_PORT: ${DB_PORT:-5432}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DB_INIT_PASSWORD: ${DB_INIT_PASSWORD:?Set DB_INIT_PASSWORD in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      HORILLA_SKIP_RELEASE_TASKS: "1"
    volumes: !override
      - media:/app/media
    deploy:
      replicas: 1
    depends_on: !reset {}

  # Not started: the host's existing PostgreSQL and Redis are used instead.
  # They only run if asked for with --profile bundled-db.
  db:
    profiles: ["bundled-db"]

  redis:
    profiles: ["bundled-db"]

  # nginx is not used in production; it keeps the base file's "production"
  # profile, so it only starts if asked for with --profile production.
