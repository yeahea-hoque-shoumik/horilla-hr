{% load i18n %}
<div class="flex items-center justify-center gap-1" onclick="event.stopPropagation();">
    {% if perms.attendance.change_worklocation %}
        {% if instance.is_active %}
        <a
            hx-get="{% url 'work-location-update' instance.pk %}"
            hx-target="#genericModalBody"
            data-toggle="oh-modal-toggle"
            data-target="#genericModal"
            class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
            title="{% trans 'Edit' %}"
        >
            <ion-icon name="create-outline"></ion-icon>
        </a>
        {% endif %}
        <button
            type="button"
            hx-post="{% url 'work-location-archive' instance.pk %}"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            hx-target="#workLocationActionResult"
            class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
            title="{% if instance.is_active %}{% trans 'Archive' %}{% else %}{% trans 'Restore' %}{% endif %}"
        >
            <ion-icon name="{% if instance.is_active %}archive-outline{% else %}refresh-outline{% endif %}"></ion-icon>
        </button>
    {% endif %}
</div>
